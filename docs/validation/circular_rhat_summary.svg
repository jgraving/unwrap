   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243244" x="25.344" y="18" transform="rotate(-0 25.344 18)">Full turns preserve direction; multimodal differences can be missed</text>
  </g>
  <g id="text_39">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="25.344" y="39.6" transform="rotate(-0 25.344 39.6)">Saved validation results · joint covariance and rank statistics remain distinct</text>
  </g>
  <g id="text_40">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243244" transform="translate(25.344 311.562078)">Compare directions modulo a turn; retain raw</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243244" transform="translate(25.344 322.2)">checks when the real coefficient matters.</text>
  </g>
  <g id="text_41">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243244" transform="translate(342.144 311.562078)">Neither approach detects every angular pattern.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #243244" transform="translate(342.144 322.2)">Inspect per-chain angular distributions.</text>
  </g>
  <g id="text_42">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="25.344" y="351" transform="rotate(-0 25.344 351)">No shared convergence cutoff is implied. Full results and definitions are in the validation report.</text>
  </g>
 </g>
