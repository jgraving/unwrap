 <title id="figure-title">Artificial light shifts dung beetle orientation at multiple levels</title><desc id="figure-description">Artificial light shifts dung beetle orientation at multiple levels. (a) Each of ten beetles repeatedly exits the arena, with ten trials per lighting condition; four light-on bearings are missing. The arena drawing is schematic. (b) Curves show kernel density estimates of the posterior population mean direction, with a common radial density scale; dots show each beetle's observed circular mean bearing. Bearings increase clockwise from north, viewed from above. The lamp icon is schematic. The arc is centred at 202.5° with a 45° half-width, using the nominal south-southwest bearing reported by Foster et al. (2021), rather than a surveyed azimuth. Sector probabilities and intervals are conditional on this approximate centre. (c) Population-level within-individual concentration, converted to mean resultant length using I₁(κ)/I₀(κ). (d) Between-individual concentration: the resultant length of the ten fitted individual mean directions, calculated in each draw. (e) Probability of an exit within the marked sector, using population direction and concentration (individual offsets set to zero); the dashed line marks the uniform expectation of 0.25. (f) The paired draw-wise difference in this probability, on minus off. Points show posterior means and bars show 89% highest-density intervals.</desc><metadata>

</div><figcaption>Artificial light shifts dung beetle orientation at multiple levels. (a) Each of ten beetles repeatedly exits the arena, with ten trials per lighting condition; four light-on bearings are missing. The arena drawing is schematic. (b) Curves show kernel density estimates of the posterior population mean direction, with a common radial density scale; dots show each beetle's observed circular mean bearing. Bearings increase clockwise from north, viewed from above. The lamp icon is schematic. The arc is centred at 202.5° with a 45° half-width, using the nominal south-southwest bearing reported by Foster et al. (2021), rather than a surveyed azimuth. Sector probabilities and intervals are conditional on this approximate centre. (c) Population-level within-individual concentration, converted to mean resultant length using I₁(κ)/I₀(κ). (d) Between-individual concentration: the resultant length of the ten fitted individual mean directions, calculated in each draw. (e) Probability of an exit within the marked sector, using population direction and concentration (individual offsets set to zero); the dashed line marks the uniform expectation of 0.25. (f) The paired draw-wise difference in this probability, on minus off. Points show posterior means and bars show 89% highest-density intervals.</figcaption></figure></main></html>
