<figcaption>Locust circular statistics. (a) Virtual-swarm schematic of the free-flight arena. (b) Leave-one-out cross-validated predictive density of the bimodal and unimodal course models (+/- one standard error). (c) Predictive check, one polar plot per model: each model's replicated posterior-predictive direction density (von Mises KDE, median and 2.5/97.5 band) against the observed bootstrap KDE (solid line). (d) The hypothesis test on the predictive-density scale: the bimodal model's posterior-predictive direction density (solid line over a tinted band) and the optic-flow (forward) and vectorial-encoding (sideways) hypothesis densities marked at their directions against the uniform reference, as the dashed circle. (e) The same test in numbers: population posterior-predictive density at the hypothesized directions against the uniform reference. (f) The test of e taken down to the individual: each animal's mean predictive density at the hypothesized directions - the geometric mean of its per-draw predictive density, on a log scale - one dot per animal, against the uniform reference (open markers: the pooled values).</figcaption></figure></main>
