site_name: unwrap
site_url: https://jgraving.github.io/unwrap/
site_description: Bayesian circular GLMs and GLMMs with PyMC and Bambi
repo_url: https://github.com/jgraving/unwrap
# Study notebooks render from their committed outputs (never executed at
# build time; see .github/workflows/docs.yml and sync_docs_notebooks.py).
# The custom template adds the "Open in Google Colab" button.
plugins:
  - mkdocs-jupyter:
      execute: false
      markdown_cell_processor: mkdocs
      custom_template: docs/jupyter_templates/notebook.html.j2
edit_uri: blob/main/docs/
theme:
  name: material
  logo: assets/unwrap-mark.svg
  favicon: assets/unwrap-mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Python setup: getting-started.md
  - Circular GLMs and GLMMs: models.md
  - Mathematical guide:
      - 1. Von Mises distribution: math/von-mises.md
      - 2. Circular GLMs: math/glms.md
      - 3. Circular GLMMs: math/glmms.md
      - 4. Mixture extensions: math/mixtures.md
  - Biological examples:
      - Overview: examples.md
      - Circular regression tutorial: notebooks/circular_regression.ipynb
      - Zebra body orientation: notebooks/zebra_escape.ipynb
      - Homing bats: notebooks/goldshtein_bats.ipynb
      - Locust direction mixtures: notebooks/locust_direction_mixture_model.ipynb
      - Locust density and order: notebooks/locust_density_order.ipynb
      - Dung beetle orientation: notebooks/beetles.ipynb
      - Periodic and circular functions: notebooks/periodic_not_circular.ipynb
      - Von Mises policy: notebooks/von_mises_policy.ipynb
  - Circular links: links.md
  - Python API guide: api.md
  - R and MATLAB: languages.md
  - Development: development.md
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
