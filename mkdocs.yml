site_name: unwrap
site_url: https://jgraving.github.io/unwrap/
site_description: Bayesian circular GLMs and GLMMs with PyMC and Bambi
repo_url: https://github.com/jgraving/unwrap
edit_uri: blob/main/docs/
theme:
  name: material
  logo: assets/unwrap-mark.svg
  favicon: assets/unwrap-mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Python setup: getting-started.md
  - Circular GLMs and GLMMs: models.md
  - Mathematical guide:
      - 1. Von Mises distribution: math/von-mises.md
      - 2. Circular GLMs: math/glms.md
      - 3. Circular GLMMs: math/glmms.md
      - 4. Mixture extensions: math/mixtures.md
  - Biological examples: examples.md
  - Circular links: links.md
  - Python API guide: api.md
  - R and MATLAB: languages.md
  - Development: development.md
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
