name: Locust figure fidelity
on:
  push:
    branches: [feat/locust-density-publication-figure]
    paths:
      - '.github/workflows/locust-figure.yml'
      - 'notebooks/locust_density_figure.py'
      - 'notebooks/assets/locust_density_order/reference.pdf'
      - 'tools/prepare_locust_figure_assets.py'
      - 'tools/refresh_locust_figure_artwork.py'
      - 'tests/test_locust_density_figure.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: locust-artwork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install figure and test dependencies
        run: |
          uv venv
          uv pip install -e '.[test,figure]' 'pymupdf==1.26.6'
      - name: Refresh units and native image export
        run: uv run --no-project python tools/refresh_locust_figure_artwork.py
      - name: Check scientific results and image fidelity
        run: uv run --no-project python -m pytest -q tests/test_locust_density_figure.py
      - uses: actions/upload-artifact@v4
        with:
          name: locust-figure-exports
          path: |
            assets/locust-density-publication
            notebooks/assets/locust_density_order/original_panels.svg
            notebooks/assets/locust_density_order/images.json

  exports:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        file:
          - assets/locust-density-publication/locust_density_publication.svg
          - assets/locust-density-publication/locust_density_publication.pdf
          - assets/locust-density-publication/locust_density_publication.png
          - assets/locust-density-publication/locust_density_publication.html
          - assets/locust-density-publication/locust_density_publication.json
          - notebooks/assets/locust_density_order/original_panels.svg
          - notebooks/assets/locust_density_order/images.json
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: locust-figure-exports
      - name: Return one verified export
        env:
          EXPORT_FILE: ${{ matrix.file }}
        shell: python
        run: |
          import base64, hashlib, json, os
          from pathlib import Path
          path = Path(os.environ["EXPORT_FILE"])
          raw = path.read_bytes()
          print("EXPORT_META " + json.dumps({"path": str(path), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}))
          print("EXPORT_START " + str(path))
          encoded = base64.b64encode(raw).decode()
          for i in range(0, len(encoded), 1000):
              print(encoded[i:i+1000])
          print("EXPORT_END")
