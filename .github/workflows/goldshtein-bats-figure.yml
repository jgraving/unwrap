name: Goldschtein bat figure fidelity
on:
  pull_request:
    paths:
      - '.github/workflows/goldshtein-bats-figure.yml'
      - 'notebooks/goldshtein_bats_publication_figure.py'
      - 'notebooks/goldshtein_bats_plots.py'
      - 'notebooks/goldshtein_bats_posthoc.py'
      - 'notebooks/goldshtein_bats_preprocess.py'
      - 'notebooks/goldshtein_bats.ipynb'
      - 'notebooks/assets/goldshtein_bats_publication/**'
      - 'unwrap/**'
      - 'tests/test_goldshtein_bats_publication_figure.py'
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'pytest.ini'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bats-artwork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install figure and test dependencies
        run: |
          uv venv
          uv pip install -e '.[test,figure]'
      - name: Check asset pins, layout and determinism (hermetic)
        run: uv run --no-project python -m pytest -q tests/test_goldshtein_bats_publication_figure.py
  deterministic-render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install figure and test dependencies
        run: |
          uv venv
          uv pip install -e '.[test,figure]'
      - name: Render twice and compare (Liberation Sans)
        run: |
          uv run --no-project python notebooks/goldshtein_bats_publication_figure.py \
            --download \
            --font-family "Liberation Sans" \
            --output-dir /tmp/bats-ci-1
          uv run --no-project python notebooks/goldshtein_bats_publication_figure.py \
            --font-family "Liberation Sans" \
            --output-dir /tmp/bats-ci-2
          diff -qr /tmp/bats-ci-1 /tmp/bats-ci-2
      - uses: actions/upload-artifact@v4
        with:
          name: bats-figure-exports
          path: /tmp/bats-ci-1
