name: Introductory notebook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e '.[notebook]'
      - name: Execute every tutorial cell
        run: |
          uv run --no-project python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/circular_regression.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=600, kernel_name="python3").execute()
          assert any("image/png" in output.get("data", {})
                     for cell in notebook.cells for output in cell.get("outputs", [])), "No rendered figures"
          Path("executed").mkdir()
          nbformat.write(notebook, "executed/circular_regression.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-circular-regression
          path: executed/circular_regression.ipynb
          retention-days: 7
  execute-r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNWRAP_R_CI: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v4
      - name: Install R packages
        run: |
          # cmdstanr is distributed by the Stan team on r-universe
          # (it is no longer on CRAN).
          Rscript -e 'install.packages("cmdstanr", repos = "https://stan-dev.r-universe.dev")'
          Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
          Rscript -e 'pak::pak(
            c("brms", "posterior", "loo", "circular",
              "ggplot2", "IRkernel"),
            binary = TRUE,
            repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest",
          )'
      - name: Install CmdStan
        run: Rscript -e 'cmdstanr::install_cmdstan()'
      - name: Register the R kernel
        run: Rscript -e 'IRkernel::installspec()'
      - name: Execute every tutorial cell (R kernel, shortened sampling)
        env:
          UNWRAP_R_CI: '1'
        run: |
          python3 -m pip install --quiet jupyter-client nbclient nbformat
          python3 - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks_r/circular_regression.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=3600, kernel_name="ir").execute()
          assert any("image/png" in output.get("data", {})
                     for cell in notebook.cells for output in cell.get("outputs", [])), "No rendered figures"
          Path("executed").mkdir(exist_ok=True)
          nbformat.write(notebook, "executed/circular_regression_r.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-circular-regression-r
          path: executed/circular_regression_r.ipynb
          retention-days: 7
