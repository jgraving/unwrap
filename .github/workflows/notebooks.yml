name: Introductory notebook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e '.[notebook]'
      - name: Execute every tutorial cell
        run: |
          uv run --no-project python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/circular_regression.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=600, kernel_name="python3").execute()
          assert any("image/png" in output.get("data", {})
                     for cell in notebook.cells for output in cell.get("outputs", [])), "No rendered figures"
          Path("executed").mkdir()
          nbformat.write(notebook, "executed/circular_regression.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-circular-regression
          path: executed/circular_regression.ipynb
          retention-days: 7
  execute-r:
    runs-on: ubuntu-latest
    # Full locust data preprocessing, six screening fits, three study
    # hierarchies, and the tutorial compile and execute sequentially.
    timeout-minutes: 240
    env:
      UNWRAP_R_CI: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v4
      - name: Install R packages
        run: |
          # insurance for source builds (RcppParallel's configure imports
          # the 'cmake' python module)
          python3 -m pip install --quiet --break-system-packages cmake || true
          Rscript -e '
            library(pak)
            # cmdstanr is on the Stan team r-universe (no longer CRAN); the
            # rest come from PPM binaries when available, source otherwise.
            repo_add(
              universe = "https://stan-dev.r-universe.dev",
              ppm = "https://packagemanager.posit.co/cran/__linux__/noble/latest"
            )
            pkg_install(c("cmdstanr", "brms", "posterior", "loo", "circular",
                          "ggplot2", "ragg", "arrow", "IRkernel"))
          '
      - name: Install CmdStan
        run: Rscript -e 'cmdstanr::install_cmdstan()'
      - name: Register the R kernel
        run: Rscript -e 'IRkernel::installspec()'
      - name: Execute every R notebook (R kernel, per-model CI budgets)
        env:
          UNWRAP_R_CI: '1'
        run: |
          python3 -m pip install --quiet jupyter-client nbclient nbformat
          python3 - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          output_dir = Path("executed/r")
          output_dir.mkdir(parents=True, exist_ok=True)
          paths = sorted(Path("notebooks_r").glob("*.ipynb"))
          assert paths, "No R notebooks found"
          for path in paths:
              print(f"Executing {path}", flush=True)
              notebook = nbformat.read(path, as_version=4)
              # Run from notebooks_r/ to exercise the repo_root resolver.
              # Grouped fits/preprocessing may exceed the tutorial's timeout.
              NotebookClient(
                  notebook, timeout=7200, kernel_name="ir",
                  resources={"metadata": {"path": str(path.parent.resolve())}},
              ).execute()
              assert any("image/png" in output.get("data", {})
                         for cell in notebook.cells for output in cell.get("outputs", [])), f"No rendered figures: {path}"
              nbformat.write(notebook, output_dir / path.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-r-notebooks
          path: executed/r/*.ipynb
          retention-days: 7

