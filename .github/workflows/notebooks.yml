name: Introductory notebook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e '.[notebook]'
      - name: Execute every tutorial cell
        run: |
          uv run --no-project python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/circular_regression.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=600, kernel_name="python3").execute()
          assert any("image/png" in output.get("data", {})
                     for cell in notebook.cells for output in cell.get("outputs", [])), "No rendered figures"
          Path("executed").mkdir()
          nbformat.write(notebook, "executed/circular_regression.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-circular-regression
          path: executed/circular_regression.ipynb
          retention-days: 7
  execute-r:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNWRAP_R_CI: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: |
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          export CODENAME
          # insurance for the packages that still build from source
          # (pak's curl dep, RcppParallel's cmake import)
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev || true
          python3 -m pip install --quiet --break-system-packages cmake || true
          Rscript -e '
            if (!requireNamespace("pak", quietly = TRUE)) {
              # PPM binary first (no compilation), CRAN source as fallback.
              ok <- tryCatch({
                install.packages("pak", repos = sprintf(
                  "https://packagemanager.posit.co/cran/__linux__/%s/latest",
                  Sys.getenv("CODENAME")))
                requireNamespace("pak", quietly = TRUE)
              }, error = function(e) FALSE)
              if (!ok) install.packages("pak",
                    repos = "https://cloud.r-project.org")
            }
            library(pak)
            # The PPM binary repo for the runner distro, resolved from
            # os-release (ubuntu-latest migrated off noble in 2026).
            os <- readLines("/etc/os-release", warn = FALSE)
            codename <- sub("^VERSION_CODENAME=\"?([^\" ]+).*$", "\\1",
                            grep("^VERSION_CODENAME", os, value = TRUE))
            # cmdstanr is on the Stan team r-universe (no longer CRAN);
            # the rest come from PPM binaries when available, source otherwise.
            repo_add(
              universe = "https://stan-dev.r-universe.dev",
              ppm = paste0("https://packagemanager.posit.co/cran/__linux__/",
                           codename, "/latest")
            )
            pkg_install(c("cmdstanr", "brms", "posterior", "loo", "circular",
                          "ggplot2", "ragg", "IRkernel"))
          '
      - name: Install CmdStan
        run: Rscript -e 'cmdstanr::install_cmdstan()'
      - name: Install python notebook tooling
        run: |
          # the jupyter CLI is needed for installspec; nbclient/nbformat
          # for the execution step below
          python3 -m pip install --quiet --break-system-packages \
            jupyter jupyter-client jupyter-core nbclient nbformat
      - name: Register the R kernel
        run: Rscript -e 'IRkernel::installspec()'
      - name: Execute every tutorial cell (R kernel, shortened sampling)
        env:
          UNWRAP_R_CI: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks_r/circular_regression.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=3600, kernel_name="ir").execute()
          assert any("image/png" in output.get("data", {})
                     for cell in notebook.cells for output in cell.get("outputs", [])), "No rendered figures"
          Path("executed").mkdir(exist_ok=True)
          nbformat.write(notebook, "executed/circular_regression_r.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: executed-circular-regression-r
          path: executed/circular_regression_r.ipynb
          retention-days: 7
